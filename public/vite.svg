<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Battery Outline -->
  <rect x="116" y="146" width="280" height="220" rx="36" fill="none" stroke="#ffffff" stroke-width="24" opacity="0.9" filter="url(#shadow)" />
  <path d="M416 216 C432 216, 440 224, 440 240 L440 272 C440 288, 432 296, 416 296" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" opacity="0.9" />
  
  <!-- Lightning Bolt -->
  <polygon points="276,176 206,276 256,276 236,336 306,236 256,236" fill="url(#boltGrad)" filter="url(#shadow)" />
</svg>
